<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- Flatpickr CSS & JS for Calendar View -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <!-- Greek Localization for Calendar (Fixed CDN URL) -->
  <script src="https://npmcdn.flatpickr.com/dist/l10n/gr.js"></script>
  
  <title>Αίτημα Ραντεβού Μασάζ</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --error: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 480px;
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      text-align: center;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: #0f172a;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .honeypot {
      display: none !important;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background-color: var(--primary);
      color: #0f172a;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
      text-align: center;
    }

    .status-box.success {
      background-color: rgba(34, 197, 94, 0.15);
      border: 1px solid var(--success);
      color: var(--success);
    }

    .status-box.error {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: var(--error);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Αίτημα Ραντεβού Μασάζ</h1>
  <p class="subtitle" style="line-height: 1.5; margin-bottom: 20px;">
    Δηλώστε εύκολα την ημέρα και την ώρα που προτιμάτε. <br/>
    Λόγω ευέλικτου ωραρίου, η υποβολή λειτουργεί ως <b>αίτημα ενδιαφέροντος</b> και θα επικοινωνήσω προσωπικά μαζί σας (μέσω τηλεφώνου ή Instagram) για την επιβεβαίωση.
  </p>

  <form id="bookingForm">
    <!-- Honeypot for Bot Prevention -->
    <input type="text" id="website" name="website" class="honeypot" tabindex="-1" autocomplete="off" />

    <div class="form-group">
      <label for="name">Όνομα / Επώνυμο *</label>
      <input type="text" id="name" required placeholder="π.χ. Γιώργος Παπαδόπουλος" />
    </div>

    <div class="form-group">
      <label for="phone">Τηλέφωνο (συμπληρώστε τουλάχιστον ένα τρόπου επικοινωνίας)</label>
      <input type="tel" id="phone" placeholder="π.χ. 6912345678" />
    </div>

    <div class="form-group">
      <label for="instagram">Instagram Username</label>
      <input type="text" id="instagram" placeholder="π.χ. my_username" />
    </div>

    <div class="form-group">
      <label for="massageType">Είδος Μασάζ *</label>
      <select id="massageType" required>
        <option value="Χαλαρωτικό (Relaxing)">Χαλαρωτικό (Relaxing)</option>
        <option value="Deep Tissue">Deep Tissue</option>
        <option value="Αθλητικό (Sports)">Αθλητικό (Sports)</option>
        <option value="Εστίαση σε τραυματισμό/πόνο">Εστίαση σε τραυματισμό/πόνο</option>
      </select>
    </div>

    <div class="form-group">
      <label for="service">Διάρκεια *</label>
      <select id="service" required>
        <option value="60 λεπτά">60 λεπτά</option>
        <option value="90 λεπτά">90 λεπτά</option>
        <option value="120 λεπτά">120 λεπτά</option>
      </select>
    </div>

    <div class="form-group">
      <label for="date">Ημερομηνία *</label>
      <input type="text" id="date" required placeholder="Επιλέξτε ημερομηνία..." />
    </div>

    <div class="form-group">
      <label for="timeSlot">Ώρα *</label>
      <select id="timeSlot" required>
        <option value="09:00">09:00</option>
        <option value="09:30">09:30</option>
        <option value="10:00">10:00</option>
        <option value="10:30">10:30</option>
        <option value="11:00">11:00</option>
        <option value="11:30">11:30</option>
        <option value="12:00">12:00</option>
        <option value="12:30">12:30</option>
        <option value="13:00">13:00</option>
        <option value="13:30">13:30</option>
        <option value="14:00">14:00</option>
        <option value="14:30">14:30</option>
        <option value="15:00">15:00</option>
        <option value="15:30">15:30</option>
        <option value="16:00">16:00</option>
        <option value="16:30">16:30</option>
        <option value="17:00">17:00</option>
        <option value="17:30">17:30</option>
        <option value="18:00">18:00</option>
        <option value="18:30">18:30</option>
        <option value="19:00">19:00</option>
        <option value="19:30">19:30</option>
        <option value="20:00">20:00</option>
        <option value="20:30">20:30</option>
        <option value="21:00">21:00</option>
      </select>
    </div>

    <div class="form-group">
      <label for="notes">Σημειώσεις / Παρατηρήσεις</label>
      <textarea id="notes" placeholder="Οποιαδήποτε λεπτομέρεια θέλετε να γνωρίζουμε..."></textarea>
    </div>

    <button type="submit" id="submitBtn">Αποστολή Αιτήματος</button>
  </form>

  <div id="statusBox" class="status-box"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const WORKER_URL = "https://massage-booking-proxy.tonisdevv.workers.dev";
  const form = document.getElementById("bookingForm");
  const statusBox = document.getElementById("statusBox");
  const submitBtn = document.getElementById("submitBtn");

  // Initialize Flatpickr Calendar
  const datePicker = flatpickr("#date", {
    locale: "gr",
    dateFormat: "Y-m-d",
    altInput: true,
    altFormat: "j F Y",
    defaultDate: "today",
    minDate: "today",
    disableMobile: "true"
  });

  form.addEventListener("submit", async function (e) {
    e.preventDefault();

    statusBox.style.display = "none";
    statusBox.className = "status-box";

    const phone = document.getElementById("phone").value.trim();
    const instagram = document.getElementById("instagram").value.trim();

    // Client-side validation: check if at least one contact info is provided
    if (!phone && !instagram) {
      statusBox.textContent = "❌ Παρακαλώ συμπληρώστε Τηλέφωνο ή Instagram username.";
      statusBox.classList.add("error");
      statusBox.style.display = "block";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "Αποστολή...";

    const formData = {
      name: document.getElementById("name").value,
      phone: phone,
      instagram: instagram,
      massageType: document.getElementById("massageType").value,
      service: document.getElementById("service").value,
      date: document.getElementById("date").value,
      timeSlot: document.getElementById("timeSlot").value,
      notes: document.getElementById("notes").value,
      website: document.getElementById("website").value
    };

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify(formData),
      });

      if (!response.ok) {
        const errorText = await response.text();
        let errorMessage = `HTTP ${response.status}`;
        try {
          const parsed = JSON.parse(errorText);
          errorMessage = parsed.error || errorMessage;
        } catch {
          errorMessage = errorText || errorMessage;
        }
        throw new Error(errorMessage);
      }

      const result = await response.json();

      if (result.success) {
        statusBox.textContent = "✅ Το αίτημα εστάλη με επιτυχία! Θα επικοινωνήσουμε σύντομα.";
        statusBox.classList.add("success");
        statusBox.style.display = "block";
        form.reset();
        datePicker.setDate(new Date()); // Reset calendar
      } else {
        throw new Error(result.error || "Αποτυχία αποστολής.");
      }
    } catch (err) {
      console.error("Error:", err);
      statusBox.textContent = `❌ ${err.message}`;
      statusBox.classList.add("error");
      statusBox.style.display = "block";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Αποστολή Αιτήματος";
    }
  });
});
</script>

</body>
</html>
