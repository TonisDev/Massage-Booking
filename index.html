<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Κράτηση Ραντεβού Massage</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Cloudflare Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #e0e6ed;
            color-scheme: dark;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #16181d;
            padding: 28px;
            border-radius: 12px;
            border: 1px solid #2a2e39;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 480px;
        }

        h2 {
            margin-top: 0;
            color: #ffffff;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        .info-box {
            background-color: #1a2332;
            border-left: 3px solid #00b0ff;
            padding: 12px 14px;
            border-radius: 4px;
            font-size: 13px;
            color: #90caf9;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #c2c9d6;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .subtitle-label {
            font-size: 11px;
            color: #6b7280;
            text-transform: none;
            font-weight: 400;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            background-color: #0d0e12;
            border: 1px solid #2a2e39;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #00b0ff;
            box-shadow: 0 0 0 2px rgba(0, 176, 255, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #00e676;
            color: #051e11;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            background-color: #00c853;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.3);
        }

        button:disabled {
            background-color: #2a2e39;
            color: #6b7280;
            cursor: not-allowed;
            box-shadow: none;
        }

        #status {
            margin-top: 16px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            min-height: 20px;
        }

        .success { color: #00e676; }
        .error { color: #ff5252; }

        /* Honeypot - hidden from real users */
        .website-field {
            position: absolute !important;
            left: -9999px !important;
            width: 1px !important;
            height: 1px !important;
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .turnstile-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Αίτημα για Ραντεβού</h2>

    <div class="info-box">
        📌 <strong>Σημείωση:</strong>
        Επιλέξτε την ημερομηνία και ώρα που σας εξυπηρετεί.
        Μόλις λάβω το αίτημά σας, θα επικοινωνήσω μαζί σας για επιβεβαίωση!
    </div>

    <form id="bookingForm">
        <div class="form-group">
            <label for="name">Ονοματεπώνυμο *</label>
            <input type="text" id="name" maxlength="80" autocomplete="name" required placeholder="π.χ. Γιώργος Παπαδόπουλος">
        </div>

        <div class="form-group">
            <label for="phone">
                Τηλέφωνο Επικοινωνίας
                <span class="subtitle-label">(Τηλέφωνο ή Instagram)</span>
            </label>
            <input type="tel" id="phone" maxlength="30" autocomplete="tel" inputmode="tel" placeholder="π.χ. 6912345678">
        </div>

        <div class="form-group">
            <label for="instagram">
                Instagram Profile
                <span class="subtitle-label">(Τηλέφωνο ή Instagram)</span>
            </label>
            <input type="text" id="instagram" maxlength="40" autocomplete="off" placeholder="@username">
        </div>

        <div class="form-group">
            <label for="massageType">Είδος Μασάζ *</label>
            <select id="massageType" required>
                <option value="Χαλαρωτικό (Relaxing)">Χαλαρωτικό</option>
                <option value="Deep Tissue">Deep Tissue</option>
                <option value="Αθλητικό (Sports)">Αθλητικό</option>
                <option value="Εστίαση σε τραυματισμό/πόνο">Εστίαση σε τραυματισμό/πόνο</option>
            </select>
        </div>

        <div class="form-group">
            <label for="service">Διάρκεια Συνεδρίας *</label>
            <select id="service" required>
                <option value="60 λεπτά">60 λεπτά</option>
                <option value="90 λεπτά">90 λεπτά</option>
                <option value="120 λεπτά">120 λεπτά</option>
            </select>
        </div>

        <div class="form-group">
            <label for="date">Προτεινόμενη Ημερομηνία *</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label for="timeSlot">Προτεινόμενη Ώρα *</label>
            <select id="timeSlot" required>
                <option value="" disabled selected>Επιλέξτε ώρα...</option>
                <option value="09:00">09:00</option>
                <option value="09:30">09:30</option>
                <option value="10:00">10:00</option>
                <option value="10:30">10:30</option>
                <option value="11:00">11:00</option>
                <option value="11:30">11:30</option>
                <option value="12:00">12:00</option>
                <option value="12:30">12:30</option>
                <option value="13:00">13:00</option>
                <option value="13:30">13:30</option>
                <option value="14:00">14:00</option>
                <option value="14:30">14:30</option>
                <option value="15:00">15:00</option>
                <option value="15:30">15:30</option>
                <option value="16:00">16:00</option>
                <option value="16:30">16:30</option>
                <option value="17:00">17:00</option>
                <option value="17:30">17:30</option>
                <option value="18:00">18:00</option>
                <option value="18:30">18:30</option>
                <option value="19:00">19:00</option>
                <option value="19:30">19:30</option>
                <option value="20:00">20:00</option>
                <option value="20:30">20:30</option>
                <option value="21:00">21:00</option>
            </select>
        </div>

        <div class="form-group">
            <label for="notes">Σημειώσεις / Διεύθυνση / Περιοχή</label>
            <textarea id="notes" rows="3" maxlength="1000" placeholder="π.χ. Διεύθυνση κατ' οίκον, σημεία με ένταση/πόνο, επιθυμητή πίεση..."></textarea>
        </div>

        <!-- Honeypot -->
        <input type="text" id="website" name="website" class="website-field" tabindex="-1" autocomplete="off" aria-hidden="true">

        <!-- Cloudflare Turnstile -->
        <div class="turnstile-container">
            <div class="cf-turnstile" data-sitekey="0x4AAAAAAEvIUriwEjx68STr" data-theme="dark" data-size="normal"></div>
        </div>

        <button type="submit" id="submitBtn">Αποστολή Αιτήματος</button>
    </form>

    <div id="status"></div>
</div>

<script>
const WORKER_URL = "https://massage-booking-proxy.tonisdevv.workers.dev/";

function getTodayAthens() {
    const formatter = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Europe/Athens",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    });
    return formatter.format(new Date());
}

const dateInput = document.getElementById("date");
const today = getTodayAthens();
dateInput.min = today;
dateInput.value = today;

function cleanText(value, maxLength) {
    return String(value || "").replace(/[\u0000-\u001F\u007F]/g, "").trim().slice(0, maxLength);
}

document.getElementById("bookingForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const btn = document.getElementById("submitBtn");
    const status = document.getElementById("status");
    const form = document.getElementById("bookingForm");

    const turnstileToken = typeof turnstile !== "undefined" ? turnstile.getResponse() : "";

    if (!turnstileToken) {
        status.className = "error";
        status.innerText = "❌ Παρακαλώ ολοκληρώστε τον έλεγχο ασφαλείας.";
        return;
    }

    const name = cleanText(document.getElementById("name").value, 80);
    const phone = cleanText(document.getElementById("phone").value, 30);
    let instagram = cleanText(document.getElementById("instagram").value, 40);
    const massageType = document.getElementById("massageType").value;
    const service = document.getElementById("service").value;
    const date = document.getElementById("date").value;
    const timeSlot = document.getElementById("timeSlot").value;
    const notes = cleanText(document.getElementById("notes").value, 1000);
    const website = cleanText(document.getElementById("website").value, 100);

    if (!phone && !instagram) {
        status.className = "error";
        status.innerText = "❌ Παρακαλώ συμπληρώστε τουλάχιστον ένα μέσο επικοινωνίας (Τηλέφωνο ή Instagram).";
        return;
    }

    if (phone) {
        let digits = phone.replace(/\D/g, "");
        if (digits.startsWith("30")) digits = digits.slice(2);

        if (!/^(69|2)\d{8}$/.test(digits)) {
            status.className = "error";
            status.innerText = "❌ Παρακαλώ εισάγετε ένα έγκυρο ελληνικό τηλέφωνο.";
            return;
        }
    }

    if (instagram) {
        instagram = instagram.replace(/\s/g, "").replace(/^@+/, "");
    }

    btn.disabled = true;
    btn.innerText = "Αποστολή...";
    status.className = "";
    status.innerText = "";

    try {
        const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name, phone, instagram, massageType, service, date, timeSlot, notes, website, turnstileToken
            })
        });

        let result;
        try {
            result = await response.json();
        } catch {
            result = {};
        }

        if (response.ok && result.success === true) {
            status.className = "success";
            status.innerText = "✓ Το αίτημα στάλθηκε επιτυχώς! Θα επικοινωνήσω μαζί σας σύντομα.";
            form.reset();
            dateInput.min = getTodayAthens();
            dateInput.value = getTodayAthens();
        } else {
            status.className = "error";
            status.innerText = "❌ " + (result.error || "Υπήρξε σφάλμα κατά την αποστολή. Δοκιμάστε ξανά.");
        }
    } catch (error) {
        console.error(error);
        status.className = "error";
        status.innerText = "❌ Υπήρξε σφάλμα κατά την αποστολή. Δοκιμάστε ξανά.";
    } finally {
        if (typeof turnstile !== "undefined") {
            turnstile.reset();
        }
        btn.disabled = false;
        btn.innerText = "Αποστολή Αιτήματος";
    }
});
</script>

</body>
</html>
