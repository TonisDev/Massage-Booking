<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Αίτημα για Ραντεβού</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
        .card { background: white; padding: 30px; border-radius: 12px; max-width: 450px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; color: #333; text-align: center; }
        p.subtitle { text-align: center; color: #666; font-size: 0.9em; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; font-size: 0.9em; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 1em; }
        button { width: 100%; background: #0088cc; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1em; transition: background 0.2s; }
        button:hover { background: #006699; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; }
        .success { color: #2e7d32; }
        .error { color: #c62828; }
    </style>
</head>
<body>

<div class="card">
    <h2>Αίτημα Κράτησης</h2>
    <p class="subtitle">Συμπληρώστε τα στοιχεία σας και την επιθυμητή ώρα. Θα επικοινωνήσω μαζί σας για επιβεβαίωση!</p>
    
    <form id="bookingForm">
        <div class="form-group">
            <label for="name">Όνομα / Nickname *</label>
            <input type="text" id="name" required placeholder="π.χ. Αλέξανδρος">
        </div>
        
        <div class="form-group">
            <label for="contact">Τηλέφωνο ή Telegram/Viber *</label>
            <input type="text" id="contact" required placeholder="π.χ. 69XXXXXXXX ή @username">
        </div>
        
        <div class="form-group">
            <label for="date">Επιθυμητή Ημέρα *</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label for="time">Επιθυμητή Ώρα (Προσεγγιστικά) *</label>
            <select id="time" required>
                <option value="">Επιλέξτε...</option>
                <option value="Πρωί (10:00 - 13:00)">Πρωί (10:00 - 13:00)</option>
                <option value="Μεσημέρι (13:00 - 17:00)">Μεσημέρι (13:00 - 17:00)</option>
                <option value="Απόγευμα/Βράδυ (17:00 - 21:00)">Απόγευμα/Βράδυ (17:00 - 21:00)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="notes">Σχόλια / Σημειώσεις (Προαιρετικό)</label>
            <textarea id="notes" rows="3" placeholder="π.χ. Προτιμώ 18:30 αν είναι διαθέσιμο"></textarea>
        </div>

        <button type="submit" id="submitBtn">Αποστολή Αιτήματος</button>
    </form>

    <div id="status"></div>
</div>

<script>
    // ΡΥΘΜΙΣΕΙΣ TELEGRAM (Συμπλήρωσε τα δικά σου στοιχεία)
    const TELEGRAM_BOT_TOKEN = 'YOUR_BOT_TOKEN_HERE';
    const TELEGRAM_CHAT_ID = 'YOUR_CHAT_ID_HERE';

    // Περιορισμός: Να μην μπορεί να διαλέξει παρελθοντική ημερομηνία
    document.getElementById('date').min = new Date().toISOString().split('T')[0];

    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        btn.disabled = true;
        btn.innerText = "Αποστολή...";
        status.innerText = "";

        const name = document.getElementById('name').value;
        const contact = document.getElementById('contact').value;
        const date = document.getElementById('date').value;
        const time = document.getElementById('time').value;
        const notes = document.getElementById('notes').value || "Καμία";

        // Μορφοποίηση του μηνύματος που θα λάβεις στο Telegram
        const message = `🔔 *ΝΕΟ ΑΙΤΗΜΑ ΡΑΝΤΕΒΟΥ*\n\n` +
                        `👤 *Όνομα:* ${name}\n` +
                        `📞 *Επικοινωνία:* ${contact}\n` +
                        `📅 *Ημερομηνία:* ${date}\n` +
                        `⏰ *Ώρα:* ${time}\n` +
                        `📝 *Σημειώσεις:* ${notes}`;

        try {
            const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            });

            if (response.ok) {
                status.className = "success";
                status.innerText = "✓ Το αίτημα στάλθηκε επιτυχώς! Θα επικοινωνήσω μαζί σας σύντομα.";
                document.getElementById('bookingForm').reset();
            } else {
                throw new Error();
            }
        } catch (err) {
            status.className = "error";
            status.innerText = "❌ Υπήρξε σφάλμα. Παρακαλώ δοκιμάστε ξανά.";
        } finally {
            btn.disabled = false;
            btn.innerText = "Αποστολή Αιτήματος";
        }
    });
</script>

</body>
</html>
