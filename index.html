<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Κράτηση Ραντεβού Massage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #e0e6ed;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #16181d;
            padding: 28px;
            border-radius: 12px;
            border: 1px solid #2a2e39;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 480px;
        }

        h2 {
            margin-top: 0;
            color: #ffffff;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        .info-box {
            background-color: #1a2332;
            border-left: 3px solid #00b0ff;
            padding: 12px 14px;
            border-radius: 4px;
            font-size: 13px;
            color: #90caf9;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #c2c9d6;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .subtitle-label {
            font-size: 11px;
            color: #6b7280;
            text-transform: none;
            font-weight: 400;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            background-color: #0d0e12;
            border: 1px solid #2a2e39;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #00b0ff;
            box-shadow: 0 0 0 2px rgba(0, 176, 255, 0.2);
        }

        color-scheme: dark;

        button {
            width: 100%;
            padding: 14px;
            background-color: #00e676;
            color: #051e11;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: #00c853;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.3);
        }

        button:disabled {
            background-color: #2a2e39;
            color: #6b7280;
            cursor: not-allowed;
            box-shadow: none;
        }

        #status {
            margin-top: 16px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
        }

        .success { color: #00e676; }
        .error { color: #ff5252; }
    </style>
</head>
<body>

<div class="container">
    <h2>Αίτημα για Ραντεβού</h2>
    
    <div class="info-box">
        📌 <strong>Σημείωση:</strong> Επιλέξτε την ημερομηνία και ώρα που σας εξυπηρετεί. Μόλις λάβω το αίτημά σας, θα επικοινωνήσω μαζί σας για επιβεβαίωση!
    </div>

    <form id="bookingForm">
        <div class="form-group">
            <label for="name">Ονοματεπώνυμο *</label>
            <input type="text" id="name" required placeholder="π.χ. Γιώργος Παπαδόπουλος">
        </div>

        <div class="form-group">
            <label for="phone">Τηλέφωνο Επικοινωνίας <span class="subtitle-label">(Τηλέφωνο ή Instagram)</span></label>
            <input type="tel" id="phone" placeholder="π.χ. 6912345678">
        </div>

        <div class="form-group">
            <label for="instagram">Instagram Profile <span class="subtitle-label">(Τηλέφωνο ή Instagram)</span></label>
            <input type="text" id="instagram" placeholder="@username">
        </div>

        <div class="form-group">
            <label for="massageType">Είδος Μασάζ *</label>
            <select id="massageType" required>
                <option value="Χαλαρωτικό (Relaxing)">Χαλαρωτικό</option>
                <option value="Deep Tissue">Deep Tissue</option>
                <option value="Αθλητικό (Sports)">Αθλητικό</option>
                <option value="Συνδυαστικό / Mix">Εστίαση σε τραυματισμό/πόνο</option>
            </select>
        </div>

        <div class="form-group">
            <label for="service">Διάρκεια Συνεδρίας *</label>
            <select id="service" required>
                <option value="60 λεπτά">60 λεπτά</option>
                <option value="90 λεπτά">90 λεπτά</option>
                <option value="120 λεπτά">120 λεπτά</option>
            </select>
        </div>

        <!-- 1. Native Date Picker (Φουλ εύχρηστο σε κινητά) -->
        <div class="form-group">
            <label for="date">Προτεινόμενη Ημερομηνία *</label>
            <input type="date" id="date" required>
        </div>

        <!-- 2. Dropdown Ώρας με ημ Both (π.χ. 10:00, 10:30) -->
        <div class="form-group">
            <label for="timeSlot">Προτεινόμενη Ώρα *</label>
            <select id="timeSlot" required>
                <option value="" disabled selected>Επιλέξτε ώρα...</option>
                <option value="09:00">09:00</option>
                <option value="09:30">09:30</option>
                <option value="10:00">10:00</option>
                <option value="10:30">10:30</option>
                <option value="11:00">11:00</option>
                <option value="11:30">11:30</option>
                <option value="12:00">12:00</option>
                <option value="12:30">12:30</option>
                <option value="13:00">13:00</option>
                <option value="13:30">13:30</option>
                <option value="14:00">14:00</option>
                <option value="14:30">14:30</option>
                <option value="15:00">15:00</option>
                <option value="15:30">15:30</option>
                <option value="16:00">16:00</option>
                <option value="16:30">16:30</option>
                <option value="17:00">17:00</option>
                <option value="17:30">17:30</option>
                <option value="18:00">18:00</option>
                <option value="18:30">18:30</option>
                <option value="19:00">19:00</option>
                <option value="19:30">19:30</option>
                <option value="20:00">20:00</option>
                <option value="20:30">20:30</option>
                <option value="21:00">21:00</option>
            </select>
        </div>

        <div class="form-group">
            <label for="notes">Σημειώσεις / Διεύθυνση / Περιοχή</label>
            <textarea id="notes" rows="3" placeholder="π.χ. Διεύθυνση κατ' οίκον, σημεία με ένταση/πόνο, επιθυμητή πίεση..."></textarea>
        </div>

        <button type="submit" id="submitBtn">Αποστολή Αιτήματος</button>
    </form>
    <div id="status"></div>
</div>

<script>
    const WORKER_URL = 'https://massage-booking-proxy.tonisdevv.workers.dev/';

    // Αυτόματο κλείδωμα περασμένων ημερομηνιών (με βάση τη σημερινή μέρα)
    const today = new Date().toISOString().split('T')[0];
    const dateInput = document.getElementById('date');
    dateInput.min = today;
    dateInput.value = today; // Προεπιλογή η σημερινή μέρα

    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        
        const phone = document.getElementById('phone').value.trim();
        let instagram = document.getElementById('instagram').value.trim();

        if (!phone && !instagram) {
            status.className = "error";
            status.innerText = "❌ Παρακαλώ συμπληρώστε τουλάχιστον ένα μέσο επικοινωνίας (Τηλέφωνο ή Instagram).";
            return;
        }

        if (phone) {
            const cleanPhone = phone.replace(/[\s\-]/g, '');
            const phoneRegex = /^(69|2)\d{8}$/;
            
            if (!phoneRegex.test(cleanPhone)) {
                status.className = "error";
                status.innerText = "❌ Παρακαλώ εισάγετε ένα έγκυρο ελληνικό τηλέφωνο (10 ψηφία).";
                return;
            }
        }

        btn.disabled = true;
        btn.innerText = "Αποστολή...";
        status.innerText = "";

        const name = document.getElementById('name').value;
        const massageType = document.getElementById('massageType').value;
        const service = document.getElementById('service').value;
        const rawDate = dateInput.value; // Formatted YYYY-MM-DD
        const [year, month, day] = rawDate.split('-');
        const formattedDate = `${day}/${month}/${year}`;
        
        const timeSlot = document.getElementById('timeSlot').value;
        const notes = document.getElementById('notes').value || "Καμία";

        if (instagram && !instagram.startsWith('@')) {
            instagram = '@' + instagram;
        }

        const formattedMessage = `🔔 *ΝΕΟ ΑΙΤΗΜΑ ΡΑΝΤΕΒΟΥ*\n\n` +
                                `👤 *Όνομα:* ${name}\n` +
                                `📞 *Τηλέφωνο:* ${phone || "Δεν δόθηκε"}\n` +
                                `📸 *Instagram:* ${instagram || "Δεν δόθηκε"}\n` +
                                `💆‍♂️ *Είδος:* ${massageType}\n` +
                                `⏱ *Διάρκεια:* ${service}\n` +
                                `📅 *Ημερομηνία:* ${formattedDate}\n` +
                                `⏰ *Ώρα:* ${timeSlot}\n` +
                                `📝 *Σημειώσεις:* ${notes}`;

        try {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: formattedMessage })
            });

            const resData = await response.json();

            if (response.ok && resData.success) {
                status.className = "success";
                status.innerText = "✓ Το αίτημα στάλθηκε επιτυχώς! Θα επικοινωνήσω μαζί σας σύντομα.";
                document.getElementById('bookingForm').reset();
                dateInput.value = today;
            } else {
                throw new Error();
            }
        } catch (err) {
            status.className = "error";
            status.innerText = "❌ Υπήρξε σφάλμα. Παρακαλώ δοκιμάστε ξανά.";
        } finally {
            btn.disabled = false;
            btn.innerText = "Αποστολή Αιτήματος";
        }
    });
</script>

</body>
</html>
