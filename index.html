<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Κράτηση Ραντεβού Massage</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 10px;
        }
        .info-box {
            background-color: #eef7fc;
            border-left: 4px solid #3498db;
            padding: 12px 15px;
            border-radius: 4px;
            font-size: 13px;
            color: #2c3e50;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #34495e;
            font-size: 14px;
        }
        .subtitle-label {
            font-size: 11px;
            color: #7f8c8d;
            font-weight: normal;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #219150;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        #status {
            margin-top: 15px;
            text-align: center;
            font-weight: 600;
        }
        .success { color: #27ae60; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <h2>Αίτημα για Ραντεβού</h2>
    
    <div class="info-box">
        📌 <strong>Σημείωση:</strong> Επιλέξτε την ημερομηνία και ώρα που σας εξυπηρετεί καλύτερα. Μόλις λάβω το αίτημά σας, θα επικοινωνήσω μαζί σας το συντομότερο για την επιβεβαίωση της διαθεσιμότητας!
    </div>

    <form id="bookingForm">
        <div class="form-group">
            <label for="name">Ονοματεπώνυμο *</label>
            <input type="text" id="name" required placeholder="π.χ. Γιώργος Παπαδόπουλος">
        </div>

        <div class="form-group">
            <label for="phone">Τηλέφωνο Επικοινωνίας <span class="subtitle-label">(Απαιτείται Τηλέφωνο ή Instagram)</span></label>
            <input type="tel" id="phone" placeholder="π.χ. 6912345678">
        </div>

        <div class="form-group">
            <label for="instagram">Instagram Profile <span class="subtitle-label">(Απαιτείται Τηλέφωνο ή Instagram)</span></label>
            <input type="text" id="instagram" placeholder="@username">
        </div>

        <div class="form-group">
            <label for="service">Διάρκεια / Είδος Συνεδρίας *</label>
            <select id="service" required>
                <option value="60 λεπτά">60 λεπτά</option>
                <option value="90 λεπτά">90 λεπτά</option>
                <option value="120 λεπτά">120 λεπτά</option>
            </select>
        </div>

        <div class="form-group">
            <label for="date">Προτεινόμενη Ημερομηνία *</label>
            <input type="date" id="date" required>
        </div>

        <div class="form-group">
            <label for="time">Προτεινόμενη Ώρα *</label>
            <input type="time" id="time" required>
        </div>

        <div class="form-group">
            <label for="notes">Σημειώσεις / Διεύθυνση / Περιοχή</label>
            <textarea id="notes" rows="3" placeholder="π.χ. Διεύθυνση για κατ' οίκον, τυχόν τραυματισμοί ή προτιμήσεις..."></textarea>
        </div>

        <button type="submit" id="submitBtn">Αποστολή Αιτήματος</button>
    </form>
    <div id="status"></div>
</div>

<script>
    const WORKER_URL = 'https://massage-booking-proxy.tonisdevv.workers.dev/';

    // Απαγόρευση επιλογής περασμένων ημερομηνιών
    document.getElementById('date').min = new Date().toISOString().split('T')[0];

    document.getElementById('bookingForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('status');
        
        const phone = document.getElementById('phone').value.trim();
        let instagram = document.getElementById('instagram').value.trim();

        // 1. Έλεγχος ότι τουλάχιστον ένα από τα δύο έχει συμπληρωθεί
        if (!phone && !instagram) {
            status.className = "error";
            status.innerText = "❌ Παρακαλώ συμπληρώστε τουλάχιστον ένα μέσο επικοινωνίας (Τηλέφωνο ή Instagram).";
            return;
        }

        // 2. Validation Τηλεφώνου (αν έχει συμπληρωθεί)
        if (phone) {
            // Καθαρισμός από κενά ή παύλες
            const cleanPhone = phone.replace(/[\s\-]/g, '');
            // Έλεγχος αν αποτελείται από 10 ψηφία και ξεκινάει από 69 ή 2
            const phoneRegex = /^(69|2)\d{8}$/;
            
            if (!phoneRegex.test(cleanPhone)) {
                status.className = "error";
                status.innerText = "❌ Παρακαλώ εισάγετε ένα έγκυρο ελληνικό τηλέφωνο (10 ψηφία).";
                return;
            }
        }

        btn.disabled = true;
        btn.innerText = "Αποστολή...";
        status.innerText = "";

        const name = document.getElementById('name').value;
        const service = document.getElementById('service').value;
        const date = document.getElementById('date').value;
        const time = document.getElementById('time').value;
        const notes = document.getElementById('notes').value || "Καμία";

        // Μορφοποίηση Instagram
        if (instagram && !instagram.startsWith('@')) {
            instagram = '@' + instagram;
        }

        const formattedMessage = `🔔 *ΝΕΟ ΑΙΤΗΜΑ ΡΑΝΤΕΒΟΥ*\n\n` +
                                `👤 *Όνομα:* ${name}\n` +
                                `📞 *Τηλέφωνο:* ${phone || "Δεν δόθηκε"}\n` +
                                `📸 *Instagram:* ${instagram || "Δεν δόθηκε"}\n` +
                                `⏱ *Διάρκεια:* ${service}\n` +
                                `📅 *Ημερομηνία:* ${date}\n` +
                                `⏰ *Ώρα:* ${time}\n` +
                                `📝 *Σημειώσεις:* ${notes}`;

        try {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: formattedMessage })
            });

            const resData = await response.json();

            if (response.ok && resData.success) {
                status.className = "success";
                status.innerText = "✓ Το αίτημα στάλθηκε επιτυχώς! Θα επικοινωνήσω μαζί σας σύντομα για την επιβεβαίωση.";
                document.getElementById('bookingForm').reset();
            } else {
                throw new Error();
            }
        } catch (err) {
            status.className = "error";
            status.innerText = "❌ Υπήρξε σφάλμα. Παρακαλώ δοκιμάστε ξανά.";
        } finally {
            btn.disabled = false;
            btn.innerText = "Αποστολή Αιτήματος";
        }
    });
</script>

</body>
</html>
